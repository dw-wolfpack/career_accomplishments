theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: false
    code: false
  features:
    - navigation.tabs
    - navigation.top
    - toc.integrate
  favicon: images/cf-mark.png
  language: en
  search:
    lang: en
    separator: '[\s\-]+'
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dw-wolfpack
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/chrisfiegel/
  footnote:
    - icon: material/launch
      text: Made with Material for MkDocs
      link: https://squidfunk.github.io/mkdocs-material/
plugins:
  - search
  - awesome-pages
  - drawio_file
  - tags:
      tags_file: tags.md
  - redirects:
      redirect_maps:
        chapter4.md: discussion-points.md
        chapter7.md: tldr.md
markdown_extensions:
  - md_in_html
extra_css:
  - stylesheets/extra.css?v=20261003i
extra_javascript:
  - javascripts/personal-universe.js?v=20261003
